<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALØR Rivals</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
    --purple: #8b5cf6;
    --bright: #c084fc;
    --dark: #05030a;
    --card: rgba(255,255,255,.045);
    --border: rgba(255,255,255,.09);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--dark);
    color: white;
    overflow-x: hidden;
}

/* ===== BACKGROUND ===== */

.bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -5;
    overflow: hidden;
}

.glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: #7c3aed;
    filter: blur(180px);
    opacity: .15;
}

.glow.one {
    top: -250px;
    left: -150px;
}

.glow.two {
    right: -250px;
    bottom: -250px;
    background: #a855f7;
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(139,92,246,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139,92,246,.035) 1px, transparent 1px);
    background-size: 70px 70px;
    mask-image: linear-gradient(to bottom, black, transparent);
}

/* ===== NAV ===== */

nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1100px, 92%);
    height: 64px;
    padding: 0 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(10,7,16,.65);
    backdrop-filter: blur(20px);

    border: 1px solid var(--border);
